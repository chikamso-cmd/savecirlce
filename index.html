<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/pwa-icon1.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#064d3d" />
    <meta
      name="description"
      content="Manage group contributions, schedules, and savings progress with SaveCircle."
    />
    <title>SaveCircle | Group Savings</title>
   <script>
      (function () {
        try {
          var t = localStorage.getItem('savecircle:theme') || 'system';
          var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
          // Brand colour picked in Settings (written by BrandContext)
          var brandCss = localStorage.getItem('savecircle:brand-css');
          var brand = localStorage.getItem('savecircle:brand');
          if (brandCss && brand) {
            var style = document.createElement('style');
            style.id = 'savecircle-brand';
            style.textContent = brandCss;
            document.head.appendChild(style);
            document.documentElement.dataset.brand = brand;
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
